<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>算力</title>
  <style>
    :root { color-scheme:light; --ink:#1b2240; --muted:#6b7390; --line:rgba(60,80,160,.12); --paper:#ffffff; --accent:#3d5bdb; --bg:#eef1f8; --ok:#1a9b6a; --wait:#c98412; --err:#c4473a; --busy:#3d5bdb; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { font-family:system-ui,-apple-system,"HarmonyOS Sans SC",sans-serif; color:var(--ink); background:var(--bg); }
    .app { height:100%; padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; }
    @media (min-width: 960px) {
      .app {
        max-width:none; height:100%; margin:0; padding:16px 20px 12px;
        display:grid; grid-template-columns:minmax(300px,380px) minmax(0,1fr);
        grid-template-rows:auto auto auto minmax(0,1fr) auto;
        grid-template-areas:"header header" "stats stats" "devlabel tasklabel" "devlist history" "sheet sheet";
        gap:8px 16px;
      }
      header { grid-area:header; }
      .stats { grid-area:stats; }
      .devices-label { grid-area:devlabel; }
      .tasks-label { grid-area:tasklabel; }
      #devices { grid-area:devlist; max-height:none; min-height:0; overflow:auto; }
      #history { grid-area:history; min-height:0; overflow:auto; }
      .sheet { grid-area:sheet; }
    }
    header { flex:0 0 auto; display:flex; align-items:center; gap:10px; }
    .brand { width:36px; height:36px; flex-shrink:0; }
    .head { min-width:0; flex:1; }
    h1 { margin:0; font-size:17px; font-weight:700; }
    .status { margin:3px 0 0; display:inline-flex; align-items:center; gap:6px; padding:2px 8px 2px 6px; border-radius:999px; background:rgba(255,255,255,.85); color:var(--muted); font-size:12px; line-height:18px; }
    .status::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
    .status.ok { color:var(--ok); background:rgba(26,155,106,.1); }
    .status.wait { color:var(--wait); background:rgba(201,132,18,.12); }
    .status.err { color:var(--err); background:rgba(196,71,58,.1); }
    .connect { flex-shrink:0; border:0; border-radius:16px; padding:8px 12px; background:#fff; color:var(--accent); font-size:13px; font-weight:650; cursor:pointer; }
    .connect:disabled { opacity:.45; cursor:default; }
    .gear { margin-left:auto; width:36px; height:36px; padding:0; border-radius:18px; font-size:18px; line-height:1; }
    .clear-tasks { margin-left:8px; border:0; border-radius:12px; padding:2px 10px; background:#fff; color:var(--accent); font-size:12px; font-weight:650; cursor:pointer; }
    .stats { display:flex; gap:8px; }
    .settings { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; gap:12px; padding:16px 20px; background:var(--bg); overflow:auto; }
    .settings[hidden] { display:none; }
    .settings-head { display:flex; align-items:center; gap:12px; }
    .settings-head h2 { margin:0; font-size:22px; font-weight:700; }
    .settings-back { border:0; border-radius:16px; padding:8px 12px; background:#fff; color:var(--accent); font:inherit; font-size:14px; font-weight:650; cursor:pointer; }
    .settings-label { margin:6px 0 0; font-size:16px; font-weight:650; color:var(--muted); }
    .model-settings { padding:16px; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .model-fields { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-top:12px; }
    .model-field { display:flex; flex:1 1 210px; min-width:0; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); }
    .model-field select, .model-field input { width:100%; min-width:0; min-height:44px; padding:8px; border:1px solid var(--line); border-radius:10px; background:#f7f9fd; color:var(--ink); font:inherit; }
    .model-field input:disabled { opacity:.55; }
    .model-apply { min-height:44px; border:0; border-radius:10px; padding:8px 16px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    .usage-reset { background:#fff; color:var(--accent); border:1px solid var(--line); }
    .model-apply:disabled { opacity:.45; cursor:default; }
    .model-hint { margin:10px 0 0; font-size:13px; color:var(--muted); line-height:1.5; }
    .stat { flex:1; max-width:200px; padding:10px 12px; border-radius:16px; background:#fff; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .stat span { font-size:12px; color:var(--muted); }
    .stat b { font-size:20px; font-weight:720; color:var(--ink); }
    .section { font-size:12px; color:var(--muted); font-weight:650; padding:2px 2px 0; }
    .list { display:flex; flex-direction:column; gap:8px; }
    #devices { max-height:30vh; overflow-y:auto; }
    .card { border-radius:16px; background:var(--paper); padding:12px 14px; box-shadow:0 8px 20px rgba(28,36,72,.04); }
    .card.task { cursor:pointer; border-left:3px solid transparent; }
    .card.task.run { border-left-color:var(--busy); }
    .card.task.err { border-left-color:var(--err); }
    .row1 { display:flex; align-items:center; gap:8px; }
    .mark { width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--accent); }
    .mark.chat { background:#0f8a74; }
    .mark.self { background:#3d5bdb; }
    .name { font-weight:650; font-size:15px; min-width:0; flex:1; }
    .name em { font-style:normal; }
    .name .to { color:var(--muted); font-weight:500; padding:0 6px; }
    .tag { margin-left:auto; font-size:12px; font-weight:650; color:var(--ok); flex-shrink:0; }
    .tag.wait { color:var(--muted); }
    .tag.run { color:var(--busy); }
    .tag.err { color:var(--err); }
    .card:not(.task) .tag { padding:1px 8px; border-radius:999px; background:rgba(26,155,106,.12); }
    .card:not(.task) .tag.wait { background:#eef1f8; }
    .card:not(.task) .tag.run { background:rgba(61,91,219,.12); }
    .card:not(.task) .tag.local { background:#efe8fb; color:#6d4bb5; }
    .meta { margin:6px 0 0; font-size:12px; color:var(--muted); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; grid-template-areas:"model heat jobs" "mem cpu jobs"; column-gap:12px; row-gap:6px; align-items:center; }
    .model { grid-area:model; min-width:0; }
    .heat { grid-area:heat; }
    .mem { grid-area:mem; }
    .cpu { grid-area:cpu; }
    .bar { display:inline-flex; align-items:center; gap:6px; }
    .bar i { display:block; width:52px; height:4px; border-radius:4px; background:#e6eaf4; overflow:hidden; }
    .bar i b { display:block; height:100%; background:var(--accent); border-radius:4px; }
    .jobs { grid-area:jobs; align-self:center; padding:1px 7px; border-radius:999px; background:#e8edfb; color:var(--accent); font-weight:650; }
    .q { margin:8px 0 0; font-size:14px; color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card.open .q { display:block; }
    .pic-tag { display:inline-block; margin-right:6px; padding:1px 6px; border-radius:8px; background:#eef1f8; color:var(--muted); font-size:11px; }
    .photo { width:120px; height:120px; object-fit:cover; border-radius:12px; display:block; margin:8px 0 0; }
    .body { display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; line-height:1.5; max-height:42vh; overflow:auto; }
    .card.open .body { display:block; }
    .empty { color:var(--muted); font-size:13px; padding:10px 4px; text-align:center; }
    .error { color:var(--err); }
    #history { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; scrollbar-width:none; }
    .sheet { flex-shrink:0; display:flex; flex-direction:column; gap:8px; }
    .preview { display:none; align-items:center; gap:10px; padding:8px 10px; border-radius:16px; background:#fff; }
    .preview.show { display:flex; }
    .preview img { width:44px; height:44px; object-fit:cover; border-radius:10px; }
    .preview span { flex:1; font-size:13px; color:var(--muted); }
    .preview-clear { width:28px; height:28px; border:0; border-radius:50%; background:#eef1f8; color:var(--muted); font-size:16px; cursor:pointer; }
    .dock { min-height:58px; display:flex; align-items:flex-end; gap:8px; padding:6px; border-radius:24px; background:#fff; box-shadow:0 10px 28px rgba(28,36,72,.08); }
    .pick,.send { flex:0 0 44px; width:44px; height:44px; display:grid; place-items:center; border:0; border-radius:50%; cursor:pointer; padding:0; color:var(--accent); background:#e8edfb; }
    .pick:disabled,.send:disabled { opacity:.4; cursor:default; }
    .send { background:var(--accent); color:#fff; }
    .send:disabled { background:#c9cedc; color:#fff; opacity:1; }
    textarea { flex:1; min-width:0; max-height:104px; resize:none; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:16px; line-height:24px; padding:10px 4px; }
    textarea::placeholder { color:#8b93ab; }
    /* Presentation only: keep native bridge and device telemetry unchanged. */
    h1 { font-size:22px; }
    .status,.connect,.clear-tasks,.tag { font-size:14px; }
    .stat span { font-size:15px; }
    .stat b { font-size:24px; }
    .section { font-size:16px; }
    .name { font-size:18px; }
    .meta { font-size:15px; column-gap:10px; row-gap:8px; }
    .card { padding:16px; }
    .bar { gap:4px; white-space:nowrap; }
    .bar i { width:42px; flex-shrink:0; }
    .device-panel { min-height:0; }
    .devices-label { margin-bottom:10px; display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; -webkit-user-select:none; }
    .devices-label::before { content:"▾"; display:inline-block; width:12px; color:var(--muted); transition:transform .2s; }
    .devices-label.collapsed::before { transform:rotate(-90deg); }
    .devices-label .dev-sum { margin-left:auto; font-weight:500; font-size:12px; color:var(--muted); }
    .device-panel.collapsed #devices { display:none; }
    .model,.heat { overflow-wrap:anywhere; }
    .jobs { font-size:13px; padding:2px 5px; }
    .task-panel { position:relative; display:flex; flex-direction:column; min-height:0; flex:1; background:#fff; border-radius:18px; border:1px solid var(--line); overflow:hidden; }
    .task-toolbar { padding:20px 22px 0; flex-shrink:0; }
    .task-heading { display:flex; align-items:center; gap:12px; }
    .task-heading h2 { margin:0; font-size:24px; font-weight:650; flex-shrink:0; }
    .usage-stats { display:flex; align-items:baseline; gap:14px; min-width:0; margin-left:2px; padding-left:14px; border-left:1px solid var(--line); }
    .usage-stat { display:flex; align-items:baseline; gap:6px; white-space:nowrap; }
    .usage-stat span { font-size:14px; font-weight:550; color:var(--muted); }
    .usage-stat b { font-size:18px; font-weight:680; color:var(--ink); font-variant-numeric:tabular-nums; }
    .clear-tasks { margin:0; padding:8px; white-space:nowrap; }
    .filters { display:flex; gap:20px; border-bottom:1px solid var(--line); }
    .filter { border:0; padding:10px 4px; background:none; color:var(--muted); font:inherit; font-size:16px; cursor:pointer; border-bottom:2px solid transparent; }
    .filter[aria-pressed="true"] { color:var(--accent); border-bottom-color:var(--accent); }
    .task-columns,.task-row { display:grid; grid-template-columns:minmax(0,1fr) 130px 90px 100px; gap:16px; align-items:center; }
    .task-columns { color:var(--muted); font-size:14px; padding:16px 0 12px; border-bottom:1px solid var(--line); }
    #history { padding:0 22px; gap:0; scrollbar-width:thin; }
    .task-row { padding:20px 0; border-bottom:1px solid var(--line); flex-shrink:0; }
    .task-info { min-width:0; }
    .task-question { margin:0; font-size:18px; font-weight:600; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
    .request-label { display:inline-block; margin-right:7px; padding:2px 6px; border-radius:6px; background:#eef1f8; color:var(--muted); font-size:13px; font-weight:500; vertical-align:middle; }
    .task-origin { margin:7px 0; font-size:15px; color:var(--muted); display:flex; align-items:center; gap:8px; }
    .task-metrics { font-size:14px; line-height:1.6; color:var(--muted); }
    .task-created { display:block; }
    .task-worker { font-size:16px; overflow-wrap:anywhere; }
    .task-state { display:flex; align-items:center; gap:7px; font-size:15px; color:var(--ok); }
    .task-state::before { content:""; width:7px; height:7px; background:currentColor; border-radius:50%; flex-shrink:0; }
    .task-state.run { color:var(--busy); }
    .task-state.err { color:var(--err); }
    .task-action { border:0; background:none; color:var(--accent); font:inherit; font-size:15px; padding:8px 0; cursor:pointer; text-align:right; }
    .task-group { padding-bottom:16px; border-bottom:1px solid var(--line); flex-shrink:0; }
    .task-group > .task-row { border:0; }
    .parent-label { display:inline-block; margin-right:8px; color:var(--accent); font-size:14px; font-weight:500; }
    .task-children { margin:0 0 0 8px; padding:0 14px 0 28px; border-radius:10px; background:#f7f9fd; }
    .task-children .task-row { position:relative; padding:16px 0; }
    .task-children .task-row::before { content:""; position:absolute; left:-20px; top:50%; width:13px; border-top:2px solid #b5c3da; pointer-events:none; }
    .task-children .task-row::after { content:""; position:absolute; left:-20px; top:0; bottom:0; border-left:2px solid #b5c3da; pointer-events:none; }
    .task-children .task-row:first-child::after { top:-12px; }
    .task-children .task-row:last-of-type { border-bottom:0; }
    .task-children .task-row:last-of-type::after { bottom:50%; }
    .child-metrics { margin-top:4px; font-size:13px; }
    .task-children .task-question { font-size:16px; font-weight:500; }
    .task-state.wait { color:var(--wait); }
    .task-state.partial { color:var(--wait); }
    .group-return { position:relative; margin:0; padding:10px 0 12px; color:var(--muted); font-size:14px; line-height:1.5; }
    .group-return::before { content:""; position:absolute; left:-20px; top:0; height:20px; width:13px; border-left:2px solid #b5c3da; border-bottom:2px solid #b5c3da; border-bottom-left-radius:6px; pointer-events:none; }
    .return-arrow { margin-right:6px; color:var(--accent); }
    .group-actions { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    .detail-context { color:var(--muted); font-size:14px; line-height:1.6; overflow-wrap:anywhere; margin-top:10px; }
    .task-preview { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; color:var(--muted); font-size:15px; line-height:1.6; margin-top:6px; }
    .task-count { margin:0; padding:12px 22px; font-size:14px; color:var(--muted); flex-shrink:0; }
    .detail { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; min-width:0; overflow:hidden; background:#fff; padding:22px; }
    .detail[hidden] { display:none; }
    .detail-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .detail-head h2 { margin:0; font-size:21px; }
    .detail-close { border:0; background:#eef1f8; color:var(--ink); border-radius:50%; width:36px; height:36px; font-size:24px; cursor:pointer; }
    .detail-title { font-size:18px; margin:12px 0 6px; line-height:1.5; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex-shrink:0; }
    .detail-route { color:var(--muted); font-size:13px; line-height:1.6; margin-bottom:4px; overflow-wrap:anywhere; flex-shrink:0; }
    .detail-metrics { display:flex; flex-wrap:wrap; gap:6px 18px; padding:10px 0; border-bottom:1px solid var(--line); flex-shrink:0; }
    .detail-metrics span { color:var(--muted); font-size:12px; }
    .detail-metrics b { margin-left:6px; font-size:13px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
    .detail-content { flex:1; min-height:80px; overflow:auto; margin-top:12px; font-size:15px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; }
    #history,#devices,.detail-content { overflow-anchor:none; touch-action:pan-y; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
    .detail-footer { font-size:13px; color:var(--muted); padding-top:12px; line-height:1.6; overflow-wrap:anywhere; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    @media (min-width:960px) {
      .app { grid-template-columns:minmax(350px,390px) minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto; grid-template-areas:"header header" "stats stats" "devices tasks" "sheet sheet"; gap:16px 20px; padding:20px; }
      .device-panel { grid-area:devices; display:flex; flex-direction:column; }
      #devices { flex:1; max-height:none; }
      .task-panel { grid-area:tasks; }
    }
    @media (max-width:1199px) {
      .task-columns,.task-row { grid-template-columns:minmax(0,1fr) 100px 74px 90px; gap:10px; }
      .task-toolbar { padding:16px 16px 0; }
      #history { padding:0 16px; }
    }
    @media (max-width:959px) {
      .app { padding:12px; }
      #devices { max-height:28vh; }
      .task-columns { display:none; }
      .task-heading h2 { font-size:21px; }
      .usage-stats { gap:10px; padding-left:10px; }
      .usage-stat span { font-size:13px; }
      .usage-stat b { font-size:16px; }
      .task-row { grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:16px 0; }
      .task-info { grid-column:1 / -1; }
      .task-worker { grid-column:1; grid-row:2; }
      .task-state { grid-column:2; grid-row:2; }
      .task-action { grid-column:2; grid-row:3; }
      .task-created { display:none; }
      .detail { position:fixed; inset:12px 12px 84px; padding:16px; border-radius:16px; box-shadow:0 12px 40px rgba(28,36,72,.16); }
      .detail .filter { font-size:14px; padding:9px 2px; }
      .detail-footer { font-size:11px; padding-top:8px; }
      .task-count { padding:8px 16px; }
    }
    @media (max-width:399px) { .bar i { width:30px; } .meta { column-gap:6px; } }
    @media (max-height:600px) {
      .detail { padding:12px; }
      .detail-title { -webkit-line-clamp:1; margin-top:8px; }
      .detail-context { display:none; }
      .detail-rounds { margin:8px 0; }
      .detail-footer { max-height:3em; overflow:auto; }
    }
    .detail-rounds{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:8px 0}
    .detail-rounds[hidden]{display:none}
    .rounds-heading{flex-shrink:0;font-size:12px;margin:0;color:var(--muted)}
    .round-list{flex:1;min-width:0;max-height:none;overflow:visible;padding:0}
    .round-list select{width:100%;min-width:0;box-sizing:border-box;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:inherit;font:inherit;font-size:12px}
    .task-result{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px}
      .task-view-switch{display:flex;gap:3px;background:#f1f3f8;border-radius:10px;padding:3px;margin-left:auto}.task-view-switch button{font:inherit;font-size:13px;white-space:nowrap;border:0;border-radius:7px;padding:7px 10px;background:none;color:var(--muted);cursor:pointer}.task-view-switch button[aria-pressed=true]{background:#fff;color:var(--accent);box-shadow:0 1px 4px #25356715}
    .flow-view{flex:1;min-height:0;overflow:auto;padding:18px 22px 24px;overscroll-behavior:contain}.flow-view[hidden],#history[hidden],#historyControls[hidden],#taskCount[hidden]{display:none}
    .flow-labels{display:grid;grid-template-columns:190px 180px 1fr;min-width:960px;color:var(--muted);font-size:16px;padding-bottom:20px}.flow-labels span:last-child{padding-left:36px}.flow-scene{position:relative;min-height:460px}.flow-wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.flow-wire{fill:none;stroke:#bfc8d8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.flow-wire.active{stroke:#4e6bd6;stroke-width:4.2}

    .flow-empty{position:absolute;left:410px;top:170px;color:var(--muted);font-size:16px}
    @media(max-width:959px){.flow-view{padding:12px 16px;min-height:230px}.task-view-switch button{font-size:12px;padding:7px}.task-toolbar{padding:14px 16px 0}.task-heading{flex-wrap:wrap}.task-view-switch{margin-left:0}.clear-tasks{font-size:12px}.stats{overflow-x:auto}.stat{flex:0 0 auto;min-width:130px}.usage-stats{flex-basis:100%;margin-left:0;padding-left:0;border-left:0}}

<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="flow-phone" viewBox="0 0 58 87"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="46" height="81" rx="8" fill="#fff"/><rect x="10" y="8" width="38" height="65" rx="3" stroke="#d3d8e1" fill="#fbfcff"/><path d="M24 5h10M24 78h10" stroke-linecap="round"/></g></symbol>
<symbol id="flow-pc" viewBox="0 0 110 83"><g fill="white" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="16" y="4" width="78" height="52" rx="4"/><rect x="21" y="9" width="68" height="41" rx="1.5" stroke="#cbd1da" stroke-width="1.2" fill="#fcfdfd"/><path d="M16 57h78l12 17q1 4-4 4H8q-5 0-4-4z"/><path d="M4 73h102M26 61h58l5 7H22z" stroke="#bdc5cf" stroke-width="1.1"/><path d="M46 71h18l3 5H43z" stroke="#b2bac5" stroke-width="1"/><path d="M34 61l-2 7m15-7-1 7m15-7 1 7m13-7 2 7" stroke="#d1d6de" stroke-width="1"/></g></symbol>
<symbol id="flow-task-text" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></symbol>
<symbol id="flow-task-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="16" cy="9" r="1.5"/><path d="m3 17 5-6 5 6 3-3 5 5"/></symbol>
<symbol id="flow-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5V8l2 1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
<symbol id="flow-mini-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 5h4m-3 14h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
<symbol id="flow-mini-pc" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m4 16-2 4h20l-2-4M9 8h6v4H9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>

  <main class="app">
    <header>
      <svg class="brand" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="12" fill="#3d5bdb"/><circle cx="11" cy="18" r="3" fill="#fff"/><circle cx="25" cy="12" r="3" fill="#fff"/><circle cx="25" cy="24" r="3" fill="#fff"/><path stroke="#fff" stroke-width="1.6" d="M13.6 16.8 22.4 13.2M13.6 19.2 22.4 22.8"/></svg>
      <div class="head"><h1 id="title">算力</h1><p id="connection" class="status wait" role="status">正在准备…</p></div>
      <button id="openSettings" class="connect gear" type="button" aria-label="设置">⚙</button>
      <button id="connect" class="connect" type="button" disabled>启用近场</button>
    </header>
    <section id="settings" class="settings" hidden>
      <div class="settings-head">
        <button id="closeSettings" class="settings-back" type="button">返回</button>
        <h2>设置</h2>
      </div>
      <h3 class="settings-label">模型选择 · 本机</h3>
      <section id="modelSettings" class="model-settings">
        <div class="model-fields">
          <label class="model-field" for="selectedModel">当前模型<select id="selectedModel"></select></label>
          <button id="applyModels" class="model-apply" type="button" disabled>应用选择</button>
        </div>
        <p id="modelHint" class="model-hint">仅列出本机已部署的模型，设置会自动保存。</p>
        <p id="modelMessage" class="model-hint" role="status" aria-live="polite"></p>
      </section>
      <h3 class="settings-label">输出方式 · 本机</h3>
      <section class="model-settings">
        <div class="model-fields">
          <label class="model-field" for="outputMode">推理输出<select id="outputMode">
            <option value="stream">流式输出（逐段显示）</option>
            <option value="complete">非流式输出（完整返回）</option>
          </select></label>
          <button id="applyOutputMode" class="model-apply" type="button" disabled>保存输出方式</button>
        </div>
        <p class="model-hint">适用于本机执行的文字和图片推理。保存后对新请求生效，正在进行的任务保持原设置。</p>
        <p id="outputModeMessage" class="model-hint" role="status" aria-live="polite"></p>
      </section>
      <h3 class="settings-label">累计统计 · 本机</h3>
      <section class="model-settings">
        <div class="model-fields">
          <label class="model-field" for="usageTasks">累计完成<input id="usageTasks" inputmode="numeric" autocomplete="off"></label>
          <label class="model-field" for="usageTokens">节省 token<input id="usageTokens" inputmode="numeric" autocomplete="off"></label>
          <label class="model-field" for="usageYuan">节省金额（元）<input id="usageYuan" inputmode="decimal" autocomplete="off"></label>
        </div>
        <div class="model-fields">
          <label class="model-field" for="usagePriceMode">计价方式<select id="usagePriceMode">
            <option value="flash">DeepSeek Flash 分时价</option>
            <option value="custom">自定义单价</option>
          </select></label>
          <label class="model-field" for="usageInputPrice">输入单价（元 / 百万 token）<input id="usageInputPrice" inputmode="decimal" autocomplete="off"></label>
          <label class="model-field" for="usageOutputPrice">输出单价（元 / 百万 token）<input id="usageOutputPrice" inputmode="decimal" autocomplete="off"></label>
        </div>
        <div class="model-fields">
          <button id="saveUsage" class="model-apply" type="button" disabled>保存累计设置</button>
          <button id="resetUsage" class="model-apply usage-reset" type="button">重置累计</button>
        </div>
        <p class="model-hint">保存后，推理任务旁的数字立即更新，之后完成的任务按所选计价继续累加。重置只清零这三项。</p>
        <p id="usageMessage" class="model-hint" role="status" aria-live="polite"></p>
      </section>
      <h3 class="settings-label">路由算法 · 本机</h3>
      <section class="model-settings">
        <div class="model-fields">
          <label class="model-field" for="routeAlgorithm">聊天请求路由<select id="routeAlgorithm"></select></label>
          <button id="applyRouteAlgorithm" class="model-apply" type="button" disabled>保存路由算法</button>
        </div>
        <p class="model-hint">仅算力设备1（调度枢纽）的聊天通路生效。保存后对新请求生效，进行中的请求保持原路由。</p>
        <p id="routeMessage" class="model-hint" role="status" aria-live="polite"></p>
      </section>
    </section>
    <div class="stats" id="stats"></div>
    <aside class="device-panel" id="devicePanel" aria-label="附近设备">
      <div class="section devices-label" id="devicesToggle" role="button" tabindex="0" aria-expanded="true">附近设备<span id="deviceCount"></span><span class="dev-sum" id="deviceSummary"></span></div>
      <div class="list" id="devices"></div>
    </aside>
    <section class="task-panel" aria-label="本机推理任务">
      <div id="taskToolbar" class="task-toolbar">
        <div class="task-heading"><h2>推理任务</h2><div id="usageStats" class="usage-stats" aria-label="累计统计"></div><div id="taskViewSwitch" class="task-view-switch" aria-label="任务视图"><button type="button" data-task-view="flow" aria-pressed="true">协同视图</button><button type="button" data-task-view="history" aria-pressed="false">任务详情</button></div><button id="clearTasks" class="clear-tasks" type="button">清空历史</button></div>
        <div id="historyControls" hidden><div id="filters" class="filters" aria-label="筛选推理请求">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter" type="button" data-filter="running" aria-pressed="false">进行中</button>
          <button class="filter" type="button" data-filter="finished" aria-pressed="false">已完成</button>
        </div>
        <div class="task-columns" aria-hidden="true"><span>任务 / 来源</span><span>执行设备</span><span>状态</span><span style="text-align:right">操作</span></div>
      </div></div>
      <section id="collaboration" class="flow-view" aria-label="设备协同运行图"></section>
      <section id="history" hidden class="list" aria-label="推理请求"></section>
      <p hidden id="taskCount" class="task-count"></p>
      <section id="detail" class="detail" role="region" aria-label="推理详情" hidden></section>
    </section>
    <div class="sheet">
      <div id="preview" class="preview">
        <img id="previewImg" alt="已选图片">
        <span>已选图片，可一起发送</span>
        <button id="previewClear" class="preview-clear" type="button" aria-label="移除图片">×</button>
      </div>
      <form id="composer" class="dock">
        <button id="pick" class="pick" type="button" aria-label="添加图片">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-1.5 3.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zM5.5 17l4.2-5.2 2.6 3.1 1.8-2.2L18.5 17z"/></svg>
        </button>
        <textarea id="prompt" rows="1" maxlength="1000" placeholder="本机提问…" aria-label="本机提问"></textarea>
        <button id="send" class="send" type="submit" aria-label="发送" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.2 20.8 21 12 3.2 3.2l-.2 7.2L13 12l-10 1.6z"/></svg>
        </button>
      </form>
    </div>
  </main>
  <script>
    const historyView=document.getElementById('history');
    const promptInput=document.getElementById('prompt');
    const sendButton=document.getElementById('send');
    const connectButton=document.getElementById('connect');
    const statsView=document.getElementById('stats');
    const usageStatsView=document.getElementById('usageStats');
    const devicesView=document.getElementById('devices');
    const pickButton=document.getElementById('pick');
    const preview=document.getElementById('preview');
    const previewImg=document.getElementById('previewImg');
    const previewClear=document.getElementById('previewClear');
    const statusView=document.getElementById('connection');
    const titleView=document.getElementById('title');
    const settingsView=document.getElementById('settings');
    const modelSettingsView=document.getElementById('modelSettings');
    const selectedModelView=document.getElementById('selectedModel');
    const modelHintView=document.getElementById('modelHint');
    const applyModelsButton=document.getElementById('applyModels');
    const modelMessageView=document.getElementById('modelMessage');
    const outputModeView=document.getElementById('outputMode');
    const applyOutputModeButton=document.getElementById('applyOutputMode');
    const outputModeMessage=document.getElementById('outputModeMessage');
    const usageTasksView=document.getElementById('usageTasks');
    const usageTokensView=document.getElementById('usageTokens');
    const usageYuanView=document.getElementById('usageYuan');
    const usagePriceModeView=document.getElementById('usagePriceMode');
    const usageInputPriceView=document.getElementById('usageInputPrice');
    const usageOutputPriceView=document.getElementById('usageOutputPrice');
    const saveUsageButton=document.getElementById('saveUsage');
    const resetUsageButton=document.getElementById('resetUsage');
    const usageMessageView=document.getElementById('usageMessage');
    const routeAlgorithmView=document.getElementById('routeAlgorithm');
    const applyRouteAlgorithmButton=document.getElementById('applyRouteAlgorithm');
    const routeMessageView=document.getElementById('routeMessage');
    let outputDraft=false;
    let usageDraft=false;
    let routeDraft=false, routeOptionsSignature='';
    let modelState=null, modelStateSignature='', modelDraft=false, modelPollAt=0;
    function refreshModels(){
      if(!settingsView||settingsView.hidden||typeof window.chatBridge.models!=='function')return;
      try{renderModelSettings(JSON.parse(window.chatBridge.models()));}catch(error){}
    }
    function syncUsagePrices(){
      const custom=!!usagePriceModeView&&usagePriceModeView.value==='custom';
      if(usageInputPriceView)usageInputPriceView.disabled=!custom;
      if(usageOutputPriceView)usageOutputPriceView.disabled=!custom;
    }
    function renderUsageSettings(state){
      if(!state||usageDraft||!usageTasksView||!usageTokensView||!usageYuanView||!usagePriceModeView||!usageInputPriceView||!usageOutputPriceView)return;
      usageTasksView.value=state.tasks||'0';
      usageTokensView.value=state.tokens||'0';
      usageYuanView.value=state.yuan||'0';
      usagePriceModeView.value=state.priceMode==='custom'?'custom':'flash';
      usageInputPriceView.value=state.inputYuan||'1';
      usageOutputPriceView.value=state.outputYuan||'4';
      syncUsagePrices();
      if(saveUsageButton)saveUsageButton.disabled=true;
    }
    function refreshUsage(){
      if(!settingsView||settingsView.hidden||typeof window.chatBridge.usageSettings!=='function')return;
      try{renderUsageSettings(JSON.parse(window.chatBridge.usageSettings()));}catch(error){}
    }
    function usagePayload(){
      return JSON.stringify({
        tasks:usageTasksView.value,tokens:usageTokensView.value,yuan:usageYuanView.value,
        priceMode:usagePriceModeView.value,inputYuan:usageInputPriceView.value,outputYuan:usageOutputPriceView.value
      });
    }
    function usageEdited(){
      usageDraft=true;
      if(saveUsageButton)saveUsageButton.disabled=false;
      syncUsagePrices();
      if(usageMessageView)usageMessageView.textContent='点击“保存累计设置”后生效。';
    }
    function openSettings(){if(!settingsView)return;settingsView.hidden=false;refreshModels();refreshUsage();}
    function closeSettings(){if(settingsView)settingsView.hidden=true;}
    const openSettingsButton=document.getElementById('openSettings');
    const closeSettingsButton=document.getElementById('closeSettings');
    if(openSettingsButton)openSettingsButton.addEventListener('click',openSettings);
    if(closeSettingsButton)closeSettingsButton.addEventListener('click',closeSettings);
    function renderModelSettings(state){
      if(!state||!modelSettingsView)return;
      modelState=state;
      if(outputModeView){
        if(!outputDraft)outputModeView.value=state.streaming===false?'complete':'stream';
        applyOutputModeButton.disabled=!outputDraft;
      }
      if(routeAlgorithmView){
        const signature=JSON.stringify(state.routeOptions||[]);
        if(signature!==routeOptionsSignature){
          routeOptionsSignature=signature;
          routeAlgorithmView.innerHTML=(state.routeOptions||[]).map(choice=>'<option value="'+esc(choice.name)+'">'+esc(choice.label)+'</option>').join('');
        }
        if(!routeDraft)routeAlgorithmView.value=state.routeAlgorithm||'least_load';
        applyRouteAlgorithmButton.disabled=!routeDraft;
      }
      const signature=JSON.stringify([state.selected,state.options]);
      if(signature!==modelStateSignature){
        modelStateSignature=signature;modelDraft=false;
        const entries=[['','自动（按请求选择）']];
        for(const choice of state.options||[])entries.push([choice.name,shortModel(choice.name)+(choice.vision?'（仅带图片）':'（文字）')]);
        if(state.selected&&!entries.some(entry=>entry[0]===state.selected))entries.push([state.selected,shortModel(state.selected)+'（不可用）']);
        selectedModelView.innerHTML=entries.map(entry=>'<option value="'+esc(entry[0])+'"'+(entry[0]===state.selected?' selected':'')+'>'+esc(entry[1])+'</option>').join('');
        selectedModelView.value=state.selected;
      }
      selectedModelView.disabled=state.locked;
      updateModelHint();
      applyModelsButton.disabled=state.locked||!modelDraft;
      if(state.locked)modelMessageView.textContent='本机正在推理或释放模型，结束后可切换。';
      else if(modelMessageView.textContent==='本机正在推理或释放模型，结束后可切换。')modelMessageView.textContent='';
    }
    function updateModelHint(){
      const choice=modelState&&(modelState.options||[]).find(item=>item.name===selectedModelView.value);
      modelHintView.textContent=!selectedModelView.value?'自动模式按请求选择文字或图片模型。设置保存在本机。':
        (choice?(choice.vision?'选择此模型后，本机只处理带图片的请求。':'选择此模型后，本机只处理文字请求。'):'所选模型当前不可用，请重新选择。');
    }
    function modelEdited(){
      modelDraft=true;applyModelsButton.disabled=!modelState||modelState.locked;
      modelMessageView.textContent='点击“应用选择”后生效。';
      updateModelHint();
    }
    if(selectedModelView)selectedModelView.addEventListener('change',modelEdited);
    if(applyModelsButton)applyModelsButton.addEventListener('click',()=>{
      try{
        const error=window.chatBridge.selectModel(selectedModelView.value);
        modelMessageView.textContent=error||'已保存，将用于后续请求。';
        if(!error){modelDraft=false;applyModelsButton.disabled=true;}
      }catch(error){modelMessageView.textContent='设置未保存，请重试。';}
    });
    if(outputModeView)outputModeView.addEventListener('change',()=>{
      outputDraft=!!modelState&&outputModeView.value!==(modelState.streaming===false?'complete':'stream');
      applyOutputModeButton.disabled=!outputDraft;
      outputModeMessage.textContent=outputDraft?'点击“保存输出方式”后生效。':'';
    });
    if(applyOutputModeButton)applyOutputModeButton.addEventListener('click',()=>{
      if(!outputDraft)return;
      try{
        const error=window.chatBridge.setOutputMode(outputModeView.value);
        outputModeMessage.textContent=error||'已保存，将用于后续推理请求。';
        if(!error){modelState.streaming=outputModeView.value==='stream';outputDraft=false;applyOutputModeButton.disabled=true;}
      }catch(error){outputModeMessage.textContent='输出方式未保存，请重试。';}
    });
    function bindUsage(view){if(!view)return;view.addEventListener('input',usageEdited);view.addEventListener('change',usageEdited);}
    bindUsage(usageTasksView);bindUsage(usageTokensView);bindUsage(usageYuanView);
    bindUsage(usagePriceModeView);bindUsage(usageInputPriceView);bindUsage(usageOutputPriceView);
    if(saveUsageButton)saveUsageButton.addEventListener('click',()=>{
      if(!usageDraft||!usageTasksView)return;
      try{
        const error=window.chatBridge.saveUsageSettings(usagePayload());
        if(error){if(usageMessageView)usageMessageView.textContent=error;return;}
        usageDraft=false;
        if(usageMessageView)usageMessageView.textContent='已保存，标题旁的数字已更新。';
        refreshUsage();

        source:child?child.device:(group.subtasks.length?group.executor:
          (Array.from(new Set(scopeCalls().map(call=>call.source).filter(Boolean))).join(' / ')||group.executor)),
        origin:group.origin,startedAt:child?(child.startedAt||0):group.startedAt,
        endedAt:child?(child.endedAt||0):group.endedAt,running:child?['queued','running'].includes(child.phase):groupRunning(group),
        resultActive:child?['queued','running'].includes(child.phase):groupRunning(group),
        chars:(child?(child.result||''):(group.answer||'')).length,truncated:child?child.resultTruncated:group.answerTruncated,
        resultStatus:phaseView(child?child.phase:group.phase)[0]
      }:null);
      if(!job)return;
      if(reset){
        const executor=publicJobName(job.source||selfLabel,'compute');
        detailView.innerHTML='<div class="detail-head"><h2>推理详情</h2><button class="detail-close" data-close="true" type="button" aria-label="关闭推理详情">×</button></div>'+
          (group&&child?'<div class="detail-context">'+esc(taskSummary(group.title))+' › '+esc(taskSummary(child.title))+'</div>':'')+
          '<h3 class="detail-title">'+esc(job.resultView?taskSummary(job.input||job.question):summaryText(job.question))+'</h3>'+
          '<div class="detail-route">来源：'+esc(publicJobName(job.origin||'本机','chat'))+' · 执行：'+esc(executor)+'</div>'+
          '<div id="detailRounds" class="detail-rounds"><div id="roundHeading" class="rounds-heading"></div><div id="roundList" class="round-list" role="group" aria-label="任务结果与调用记录"></div></div>'+
          '<div class="filters" aria-label="推理详情内容">'+[['output','输出'],['input','输入'],['runtime','运行信息']].map(([value,label])=>
            '<button class="filter" type="button" data-tab="'+value+'" aria-pressed="'+(value===detailTab)+'">'+label+'</button>').join('')+'</div>'+
          '<div id="detailMetrics" class="detail-metrics"></div><div id="detailContent" class="detail-content" tabindex="0"></div>'+
          '<div id="detailFooter" class="detail-footer"></div>';
        detailView.hidden=false;
        detailFollow=true;
        const output=document.getElementById('detailContent');
        if(output)output.addEventListener('scroll',()=>{detailFollow=output.scrollHeight-output.clientHeight-output.scrollTop<=4;});
        historyView.inert=true;
        if(taskToolbarView)taskToolbarView.inert=true;
      }
      renderRoundNavigation();
      const metrics=document.getElementById('detailMetrics');
      const content=document.getElementById('detailContent');
      const footer=document.getElementById('detailFooter');
      if(metrics)metrics.innerHTML=detailMetrics(job);
      if(content){
        const previousTop=content.scrollTop;
        const follow=detailFollow&&content.scrollHeight-content.clientHeight-previousTop<=4;
        const text=detailText(job);
        const changed=content.textContent!==text||reset;
        if(changed){
          content.textContent=text;
          if(!reset)content.scrollTop=follow&&detailTab==='output'?content.scrollHeight:previousTop;
        }
        content.className='detail-content'+(job.error&&detailTab==='output'?' error':'');
        if(detailTab==='input'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(job.image||'')&&
          (changed||!content.querySelector('img.photo'))){
          const photo=document.createElement('img');
          photo.className='photo';photo.alt='请求附图';photo.src=job.image;content.appendChild(photo);
        }
      }
      if(footer)footer.textContent=(job.resultView?'任务ID '+job.taskId:'请求ID '+job.id)+' · '+createdAt(job.startedAt)+
        (job.resultView&&scopeCalls().length===0?' · 当前仅有返回结果，未收到该设备的逐轮推理记录':'');
    }
    function closeDetail(){
      const previousKey=detailKey;
      detailKey='';
      detailGroupKey='';detailChildId='';
      if(detailView){detailView.hidden=true;detailView.innerHTML='';}
      historyView.inert=false;
      if(taskToolbarView)taskToolbarView.inert=false;
      if(detailTrigger&&detailTrigger.isConnected)focusWithoutScroll(detailTrigger);
      else if(previousKey)focusRequest(previousKey);
      detailTrigger=null;
    }
    function focusRequest(key){
      if(!historyView.querySelectorAll)return;
      const button=Array.from(historyView.querySelectorAll('[data-detail]')).find(item=>item.getAttribute('data-detail')===key);
      if(button)focusWithoutScroll(button);
    }
    function render(){renderFlow();renderStats();renderDevices();renderJobs();updateButton();}
    historyView.addEventListener('click',event=>{
      const collapse=event.target.closest('[data-collapse]');
      if(collapse){const key=collapse.getAttribute('data-collapse');
        if(collapsedGroups.has(key))collapsedGroups.delete(key);else collapsedGroups.add(key);
        renderJobs();return;}
      const summary=event.target.closest('[data-summary]');
      const childButton=event.target.closest('[data-child]');
      const result=event.target.closest('[data-result]');
      if(summary||childButton||result){
        const target=summary||childButton||result;
        detailGroupKey=summary?summary.getAttribute('data-summary'):target.getAttribute('data-group');
        detailChildId=childButton?target.getAttribute('data-child'):(result?target.getAttribute('data-result'):'');
        const group=groups.find(item=>item.key===detailGroupKey);if(!group)return;
        detailKey='';
        detailTab='output';detailTrigger=target;renderDetail(true);
        if(detailView)focusWithoutScroll(detailView.querySelector('[data-close]'));return;
      }
      const button=event.target.closest('[data-detail]');
      if(!button)return;
      detailGroupKey='';detailChildId='';
      detailKey=button.getAttribute('data-detail');detailTab='output';detailTrigger=button;
      renderDetail(true);
      if(detailView)focusWithoutScroll(detailView.querySelector('[data-close]'));
    });
    if(filtersView)filtersView.addEventListener('click',event=>{
      const button=event.target.closest('[data-filter]');if(!button)return;
      activeFilter=button.getAttribute('data-filter');renderJobs();
      focusWithoutScroll(filtersView.querySelector('[aria-pressed="true"]'));
    });
    if(detailView)detailView.addEventListener('click',event=>{
      if(event.target.closest('[data-close]')){closeDetail();return;}
      const button=event.target.closest('[data-tab]');if(!button)return;
      detailTab=button.getAttribute('data-tab');renderDetail(true);
      focusWithoutScroll(detailView.querySelector('[aria-pressed="true"]'));
    });
    if(detailView)detailView.addEventListener('change',event=>{
      if(!event.target.closest('[data-call]'))return;
      const calls=scopeCalls();
      if(event.target.value===''&&detailGroupKey){detailKey='';renderDetail(true);return;}
      if(!calls.some(item=>jobKey(item)===event.target.value))return;
      detailKey=event.target.value;renderDetail(true);
      focusWithoutScroll(detailView.querySelector('[data-call]'));
    });
    if(detailView)for(const eventName of ['wheel','touchstart','pointerdown','keydown'])detailView.addEventListener(eventName,event=>{
      if(event.target.closest('#detailContent'))detailFollow=false;
    });
    previewClear.addEventListener('click',()=>{window.chatBridge.clearImage();setPendingImage('');});
    promptInput.addEventListener('input',()=>{promptInput.style.height='auto';promptInput.style.height=Math.min(promptInput.scrollHeight,104)+'px';updateButton();});
    document.getElementById('composer').addEventListener('submit',(event)=>{
      event.preventDefault();
      if(localRunning()){window.chatBridge.stop();sendButton.disabled=true;sendButton.setAttribute('aria-label','正在停止');return;}
      const text=promptInput.value.trim();
      if(!text&&!pendingImage)return;
      const question=text?(pendingImage?('（附图）'+text):text):'请描述这张图片。';
      try{
        const error=window.chatBridge.send(question);
        if(error){
          jobs.unshift({id:'err-'+Date.now(),source:selfLabel,origin:'本机',local:true,image:pendingImage,question:question,answer:error,chars:0,startedAt:Date.now(),
            firstAt:0,endedAt:Date.now(),running:false,error:true,elapsedMs:0});
          render();return;
        }
        promptInput.value='';promptInput.style.height='auto';promptInput.blur();setPendingImage('');
      }catch(error){
        jobs.unshift({id:'err-'+Date.now(),source:selfLabel,origin:'本机',local:true,question:question,answer:'暂时无法发送，请重新打开应用。',chars:0,
          startedAt:Date.now(),firstAt:0,endedAt:Date.now(),running:false,error:true,elapsedMs:0});
        render();
      }
    });
    promptInput.addEventListener('keydown',(event)=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();document.getElementById('composer').requestSubmit();}});
    window.onNativeEvent=(event)=>{
      if(event.kind==='connection'){
        available=event.available===true;
        if(typeof event.pendingText==='string')pendingText='正在生成…';
        setStatus(event.text,event.connecting===true,available);
        connectButton.textContent=event.connectLabel||'启用近场';
        connectButton.disabled=event.connecting===true;
        setSelfLabel(event.selfLabel);
        updateButton();return;
      }
      if(event.kind==='image'){setPendingImage(event.text);return;}
      if(event.kind==='image-error'){
        jobs.unshift({id:'err-'+Date.now(),source:selfLabel,origin:'本机',local:true,question:'添加图片',answer:event.text,chars:0,
          startedAt:Date.now(),firstAt:0,endedAt:Date.now(),running:false,error:true,elapsedMs:0});
        render();return;
      }
      if(event.kind==='dashboard'){
        renderModelSettings(event.modelSettings);
        setSelfLabel(event.selfLabel);
        if(typeof event.text==='string'&&event.text)setStatus(event.text,event.connecting===true,true);
        if(event.connectLabel)connectButton.textContent=event.connectLabel;
        if(event.connecting===true||event.connecting===false)connectButton.disabled=event.connecting===true;
        available=true;
        devices=event.devices||[];
        jobs=event.jobs||[];
        remoteCalls=event.remoteCalls||[];
        queuedCalls=event.queuedCalls||[];
        mirroredCalls=event.flowCalls||[];
        groups=event.groups||[];
        usageView=event.usage&&typeof event.usage.tasks==='number'?event.usage:{tasks:0,tokens:0,microYuan:0};
        running=typeof event.running==='number'?event.running:jobs.filter(job=>job.running).length;
        render();return;
      }
      if(event.kind==='remote-start'){updateButton();return;}
      if(event.kind==='text'){patchJob(event.requestId,event.text,false,false);return;}
      if(event.kind==='done'){
        patchJob(event.requestId,event.text,event.error===true,true);
        updateButton();
      }
    };
    if(typeof setInterval==='function')setInterval(()=>{
      if(Date.now()-modelPollAt>=2000){modelPollAt=Date.now();refreshModels();}
      let dirty=groups.some(groupRunning);
      for(const job of allCalls()){
        if(!job.running||!job.startedAt)continue;
        job.elapsedMs=Date.now()-job.startedAt;
        dirty=true;
      }
      if(dirty)renderJobs();
      renderFlow();renderStats();
    },400);
    render();
  </script>
</body>
</html>
